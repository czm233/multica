# 从 fork 源码构建 backend/web 镜像并推送到 GHCR，
# 供自托管服务器通过 MULTICA_BACKEND_IMAGE / MULTICA_WEB_IMAGE 拉取。
#
# 触发规则：
#   - push 到 main 时，先检测变更路径，只有影响镜像的文件变了才构建
#     （backend 看 server/，web 看 apps/web/ + packages/，互不牵连）
#   - 改文档 / CI 配置等不影响镜像的 push 不会触发构建
#   - 也可在 GitHub 页面手动触发（workflow_dispatch）
name: docker-build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'Dockerfile'
              - 'docker/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'Dockerfile.web'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - 'turbo.json'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-backend:${{ github.sha }}
          build-args: |
            VERSION=custom-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=custom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
