# 从 fork 源码构建 backend/web 镜像并推送到 GHCR，
# 供自托管服务器通过 MULTICA_BACKEND_IMAGE / MULTICA_WEB_IMAGE 拉取。
name: docker-build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-backend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-backend:${{ github.sha }}
          build-args: |
            VERSION=custom-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/multica-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=custom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
